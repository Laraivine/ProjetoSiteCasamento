<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <title>Página de Pagamento</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            background: #f5f5f5;
        }

        /* HEADER */
        header {
            background: #5a2ca0;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header .logo {
            font-size: 26px;
            font-weight: 700;
        }

        /* LAYOUT */
        .container {
            display: flex;
            gap: 20px;
            padding: 25px;
            max-width: 1200px;
            margin: auto;
        }

        /* CARD */
        .card {
            background: white;
            padding: 25px;
            border-radius: 6px;
            box-shadow: 0 0 8px rgba(0, 0, 0, 0.1);
        }

        /* ESQUERDA */
        .left {
            flex: 2;
        }

        .left input[type=text],
        .left input[type=email] {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }



        .payment-options {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .pay-btn {
            flex: 1;
            text-align: center;
            border: 2px solid #007adf;
            border-radius: 8px;
            padding: 20px;
            cursor: pointer;
        }

        .pay-btn:hover {
            background: #e0f0ff;
        }

        .discount {
            background: #ffcccc;
            color: #c00;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
            font-size: 12px;
        }

        /* DIREITA */
        .right {
            flex: 1;
            height: fit-content;
        }

        .product {
            display: flex;
            gap: 10px;
        }

        .product img {
            width: 85px;
            height: 65px;
            object-fit: cover;
            border-radius: 5px;
        }

        .coupon-box input {
            padding: 10px;
            width: 65%;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .coupon-box button {
            padding: 10px 12px;
            background: #007adf;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
        }

        .totals {
            text-align: right;
            font-size: 22px;
            font-weight: bold;
            color: green;
        }
    </style>
</head>

<body>

    <header>
        <div class="logo">LOGO</div>
        <div>Voltar</div>
    </header>

    <div class="container">

        <!-- COLUNA ESQUERDA -->
        <div class="card left">
            <h2>Pagamento</h2>


            <h3>DADOS PESSOAIS</h3>

            <label>Nome no Cartão</label>
            <input type="text" placeholder="Fulano Cicrano da Silva">

            <label>Numero do Cartão *</label>
            <input type="text" placeholder="xxxx xxxx xxxx xxxx">

            <label>Data de Expiração*</label>
            <input type="email" placeholder="01/11">

            <label>Código de Segurança(CVV) *</label>
            <input type="text" placeholder="111">

            <h3>SELECIONE A FORMA DE PAGAMENTO</h3>

            <div class="payment-options">
                <div class="pay-btn">
                    💳 Cartão de crédito
                </div>


            </div>

        </div>

        <!-- COLUNA DIREITA -->
        <div class="card right">
            <h3>Resumo da sua compra</h3>

            <div class="product">
            </div>

            <hr>

            <!-- Local onde vai ser colocado os produtos -->


            <hr>


        </div>
    </div>

</body>

</html>
