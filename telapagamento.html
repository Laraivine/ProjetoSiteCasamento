<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convite de Casamento - Odilon & Martha</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Playfair Display', serif;
        }

        body {
            background: linear-gradient(135deg, #907db4 0%, #ffffff 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            color: #907db4;
        }

        .container {
            max-width: 500px;
            width: 100%;
            background-color: rgb(255, 255, 255);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            position: relative;
        }

        .header {
            background: linear-gradient(to right, #9d82bd, #9d82bd);
            color: white;
            text-align: center;
            padding: 40px 20px;
            position: relative;
        }

        .header::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(to right, #907db4, #907db4, #907db4);
        }

        .names {
            font-size: 36px;
            font-weight: 500;
            letter-spacing: 3px;
            margin-bottom: 10px;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.2);
        }

        .ampersand {
            font-size: 28px;
            margin: 0 10px;
            color: #d3dace;
        }

        .divider {
            width: 80px;
            height: 2px;
            background-color: #ffffff;
            margin: 20px auto;
        }

        .content {
            padding: 40px 30px;
            text-align: center;
        }

        .pix-section {
            background-color: #d7cdeb;
            border-radius: 10px;
            padding: 25px;
            margin: 30px 0;
            border: 1px dashed #907db4;
        }

        .pix-title {
            font-size: 22px;
            color: #5a4c3e;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .pix-key {
            background-color: white;
            border: 1px solid #907db4;
            border-radius: 8px;
            padding: 15px;
            font-size: 18px;
            margin: 20px 0;
            word-break: break-all;
            color: #5a4c3e;
            font-weight: 500;
        }

        .date-section {
            margin-top: 40px;
            padding: 20px;
            background: linear-gradient(to right, #907db4, #907db4);
            border-radius: 10px;
        }

        .date {
            font-size: 28px;
            font-weight: 500;
            color: #ffffff;
            letter-spacing: 2px;
        }

        .month {
            font-size: 18px;
            text-transform: uppercase;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .year {
            font-size: 18px;
            margin-top: 5px;
            color: #5a4c3e;
        }

        .ornament {
            font-size: 24px;
            color: #d4af37;
            margin: 0 10px;
        }

        .footer {
            padding: 20px;
            text-align: center;
            font-size: 14px;
            color: #907db4;
            border-top: 1px solid #f5e8d0;
        }

        .copy-btn {
            background-color: #907db4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.3s;
        }

        .copy-btn:hover {
            background-color: #9569a0;
        }

        .success-message {
            color: #2e8b57;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }

        @media (max-width: 480px) {
            .names {
                font-size: 28px;
            }
            
            .pix-key {
                font-size: 16px;
            }
            
            .date {
                font-size: 24px;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="names">
                Odilon <span class="ampersand">&</span> Martha
            </div>
            <div class="divider"></div>
        </div>
        
        <div class="content">
            <div class="pix-section">
                <div class="pix-title">PAGUE COM PIX</div>
                <div class="divider"></div>
                
                <p>CHAVE PIX:</p>
                <div class="pix-key" id="pixKey">BP.MARTHA98@GMAIL.COM</div>
                
                <button class="copy-btn" id="copyBtn">Copiar Chave PIX</button>
                <div class="success-message" id="successMessage">Chave PIX copiada com sucesso!</div>
            </div>
            
            <div class="date-section">
                <div class="month">JAN</div>
                <div class="date">10 <span class="ornament">•</span> 2026</div>
            </div>
        </div>
        
        <div class="footer">
            Com amor, Odilon & Martha
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const copyBtn = document.getElementById('copyBtn');
            const pixKey = document.getElementById('pixKey');
            const successMessage = document.getElementById('successMessage');
            
            copyBtn.addEventListener('click', function() {
                // Cria um elemento de texto temporário
                const tempTextArea = document.createElement('textarea');
                tempTextArea.value = pixKey.textContent;
                document.body.appendChild(tempTextArea);
                
                // Seleciona e copia o texto
                tempTextArea.select();
                tempTextArea.setSelectionRange(0, 99999); // Para dispositivos móveis
                
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        successMessage.style.display = 'block';
                        setTimeout(function() {
                            successMessage.style.display = 'none';
                        }, 3000);
                    }
                } catch (err) {
                    console.error('Falha ao copiar texto: ', err);
                }
                
                // Remove o elemento temporário
                document.body.removeChild(tempTextArea);
            });
        });
    </script>
</body>
</html>
